<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Zerodha - Your Modern Trading Platform" />
    
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <title>Zerodha - Trading Platform</title>
    
    <!-- Suppress manifest.json 401 errors (Vercel preview deployment issue) -->
    <script>
      // Suppress manifest.json 401 errors on Vercel preview deployments
      if (window.location.hostname.includes('vercel.app')) {
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
          if (args[0] && args[0].includes && args[0].includes('manifest.json')) {
            return originalFetch.apply(this, args).catch(() => {
              // Silently ignore manifest.json fetch errors
              return new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } });
            });
          }
          return originalFetch.apply(this, args);
        };
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
